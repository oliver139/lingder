name: 🐞 Bug report
description: Report an issue
labels: [pending triage]
type: Bug
title: 'BUG | '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please follow the following title formats:
        > ``BUG | Short Description``

        For example:
        > BUG | Wrong pronunciation
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. PRs are always welcome if you have a fix for the bug.
      placeholder: Bug description
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Which OS and browser are you using? Please provide the version as well.
      placeholder: |
        For example:
        - OS: MacOS 15.6.1
        - Browser: Firefox 159
      value: |
        - OS:
        - Browser:
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        # - label: Follow our [Code of Conduct](https://github.com/vueuse/vueuse/blob/main/CODE_OF_CONDUCT.md)
        #   required: true
        # - label: Read the [Contributing Guidelines](https://github.com/vueuse/vueuse/blob/main/CONTRIBUTING.md).
        #   required: true
        - label: Check that there isn't [already an issue](https://github.com/oliver139/lingder/issues) that reports the same bug to avoid creating a duplicate.
          required: true
