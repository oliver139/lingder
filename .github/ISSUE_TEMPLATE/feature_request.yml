name: 🚀 New feature proposal
description: Propose a new feature
type: Feature
title: ''
body:
  - type: markdown
    attributes:
      value: Thanks for your interest in the project and taking the time to fill out this feature report!
  - type: textarea
    id: feature-description
    attributes:
      label: New feature description
      description: PRs for new features are always welcome too!
    validations:
      required: true
  - type: textarea
    id: feature-reason
    attributes:
      label: Why would you propose this feature?
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        # - label: Follow our [Code of Conduct](https://github.com/vueuse/vueuse/blob/main/CODE_OF_CONDUCT.md)
        #   required: true
        # - label: Read the [Contributing Guidelines](https://github.com/vueuse/vueuse/blob/main/CONTRIBUTING.md).
        #   required: true
        - label: Check that there isn't [already an issue](https://github.com/oliver139/lingder/issues) that request the same feature to avoid creating a duplicate.
          required: true
