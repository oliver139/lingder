name: Deploy stable release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: lingder-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://lingder.olimak.dev
      DEPLOY_URL: https://lingder.olimak.dev
      DEPLOY_REVISION: ${{ github.sha }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      CF_SEND_TELEMETRY: 'false'
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the declared pnpm version
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install the declared Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser:run
      - run: pnpm generate
      - run: pnpm deploy:package
      - run: pnpm deploy:check
      - name: Deploy the validated static package
        run: pnpm exec cf deploy --prebuilt --mode production --tag "$RELEASE_TAG" --message "$DEPLOY_REVISION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm deploy:smoke; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Deployment summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            printf '## Lingder deployment\n\n'
            printf 'Result: %s\n\n' "$RESULT"
            printf 'Release: `%s`\n\nCommit: `%s`\n\n' "$RELEASE_TAG" "$DEPLOY_REVISION"
            printf 'Site: %s\n' "$DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
